# Throwaway, for the one-build trial: everything both features need on one network. Private events'
# network (snowglobe.private-events.yml) plus a group host, and atmo on its public https name, since
# the group sign-in is a confidential client, which a loopback address cannot be.
#
#   SG_FILE=snowglobe.trial.yml pnpm exec snowglobe up
#   SG_FILE=snowglobe.trial.yml pnpm exec snowglobe run --app atmo -- pnpm --filter web exec vite dev --config scripts/groups-e2e.vite.config.ts --host 0.0.0.0 --strictPort
#   SG_FILE=snowglobe.trial.yml pnpm exec snowglobe run --app walk -- pnpm --filter web exec node e2e/private-events.walk.mjs
#   SG_FILE=snowglobe.trial.yml pnpm exec snowglobe run --app e2e -- node apps/web/scripts/groups-e2e.mjs

globe: atmotrial # every name below is under atmotrial.local.snowglobe.at

pds:
  - name: alpha
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e
    bare_handles: true
    invites: required
  - name: beta
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e
    invites: required
  - name: regular
    image: ghcr.io/bluesky-social/pds:0.4.5037
  # Open sign-up, for the read probe's 100 members.
  - name: crowd
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e

grouphosts:
  - name: gh
    kind: opensocial
    build: /home/tscanlan/work/atproto-group-host

services:
  jetstream: true
  slingshot: true
  pdsls: false
  cdn: true

lexicons:
  authority: alpha
  publish: snowglobe/lexicons

accounts:
  - alice@alpha
  - bob@alpha
  - mallory@alpha
  - erin@alpha
  - dana@beta
  - carol@regular

apps:
  - name: atmo
    local: { port: 5454 }
    env:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      LOCAL_STATE_DIR: .wrangler/snowglobe-trial
      OAUTH_PUBLIC_URL: ${apps.atmo.url}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${apps.atmo.host}
      CRON_SECRET: local-network-only
      PRIVATE_EVENTS: 'true'
      GROUP_HOST_URL: ${grouphosts.gh.url}
      SPACES_PDS_URL: ${pds.alpha.url}
      PUBLIC_PLC_URL: ${services.plc.url}
      PUBLIC_SLINGSHOT_URL: ${services.slingshot.url}
      PUBLIC_JETSTREAM_URL: ${services.jetstream.url}
      PUBLIC_RELAY_URLS: ${services.relay.url}
      PUBLIC_SIGNUP_PDS_URL: ${pds.alpha.url}
      PUBLIC_CDN_URL: ${services.cdn.url}

  - name: walk
    env:
      WALK_ATMO: ${apps.atmo.url}
      ALPHA_URL: ${pds.alpha.url}
      BETA_URL: ${pds.beta.url}
      REGULAR_URL: ${pds.regular.url}
      CROWD_URL: ${pds.crowd.url}
      PLC_URL: ${services.plc.url}
      GROUP_HOST_URL: ${grouphosts.gh.url}
      JETSTREAM_URL: ${services.jetstream.url}
      CRON_SECRET: local-network-only
      ALICE_HANDLE: ${accounts.alice.handle}
      ALICE_PASSWORD: ${accounts.alice.password}
      BOB_HANDLE: ${accounts.bob.handle}
      BOB_PASSWORD: ${accounts.bob.password}
      MALLORY_HANDLE: ${accounts.mallory.handle}
      MALLORY_PASSWORD: ${accounts.mallory.password}
      ERIN_HANDLE: ${accounts.erin.handle}
      ERIN_PASSWORD: ${accounts.erin.password}
      DANA_HANDLE: ${accounts.dana.handle}
      DANA_PASSWORD: ${accounts.dana.password}
      CAROL_HANDLE: ${accounts.carol.handle}
      CAROL_PASSWORD: ${accounts.carol.password}

  - name: e2e
    env:
      E2E_ATMO: ${apps.atmo.url}
      E2E_GROUP_HOST: ${grouphosts.gh.url}
      E2E_PLC_URL: ${services.plc.url}
      E2E_PDS: ${pds.alpha.url}
      E2E_OWNER_HANDLE: ${accounts.alice.handle}
      E2E_OWNER_PASSWORD: ${accounts.alice.password}
      E2E_MEMBER_HANDLE: ${accounts.bob.handle}
      E2E_MEMBER_PASSWORD: ${accounts.bob.password}
      E2E_OUTSIDER_HANDLE: ${accounts.mallory.handle}
      E2E_OUTSIDER_PASSWORD: ${accounts.mallory.password}
      E2E_NOSPACES_HANDLE: ${accounts.carol.handle}
      E2E_NOSPACES_PASSWORD: ${accounts.carol.password}
