# The network for atmo's private events: two PDSes with spaces support, so a guest can be on another
# server than the host, and a stock release without it, for the person whose server can't take part.
# Beside snowglobe.yml, so one checkout can run both. A snowglobe command reads it through SG_FILE.
#
#   pnpm test:e2e:private   # starts the network if need be, then apps/web/e2e/private-events.e2e.ts
#   SG_FILE=snowglobe.private-events.yml pnpm exec snowglobe up
#   SG_FILE=snowglobe.private-events.yml pnpm exec snowglobe run --app atmo -- pnpm --filter web dev --strictPort
#   SG_FILE=snowglobe.private-events.yml pnpm exec snowglobe down
#
# As on snowglobe.yml, the tests empty atmo's local database (.wrangler/snowglobe-private) before
# each run.

globe: atmoprivate # every name below is under atmoprivate.local.snowglobe.at

pds:
  - name: alpha # the spaces alpha; handles <name>.atmoprivate.local.snowglobe.at
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e
    bare_handles: true
    invites: required
  - name: beta
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e
    invites: required
  - name: regular
    image: ghcr.io/bluesky-social/pds:0.4.5037

services:
  jetstream: true
  slingshot: true
  pdsls: false
  cdn: true

lexicons:
  # Every PDS here resolves lexicons from this one: the permission sets atmo's sign-in asks for, and
  # the space type its private events use.
  authority: alpha
  publish: apps/web/e2e/lexicons

accounts:
  - alice@alpha
  - bob@alpha
  - mallory@alpha
  - dana@beta
  - carol@regular

apps:
  - name: atmo
    env:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      LOCAL_STATE_DIR: &atmo-state .wrangler/snowglobe-private
      # Empty: atmo's loopback OAuth client, which needs no keys.
      OAUTH_PUBLIC_URL: ''
      # Only for this local network. The tests send it to run atmo's ingest.
      CRON_SECRET: &cron-secret local-network-only
      PRIVATE_EVENTS: 'true'
      SPACES_PDS_URL: ${pds.alpha.url}
      PUBLIC_PLC_URL: ${services.plc.url}
      PUBLIC_SLINGSHOT_URL: ${services.slingshot.url}
      PUBLIC_JETSTREAM_URL: ${services.jetstream.url}
      PUBLIC_RELAY_URLS: ${services.relay.url}
      PUBLIC_SIGNUP_PDS_URL: ${pds.alpha.url}
      PUBLIC_CDN_URL: ${services.cdn.url}

  # The tests in apps/web/e2e. Every name starts E2E_, so the setup keeps them, the passwords
  # included, out of atmo's environment.
  - name: e2e
    env:
      # The suite for this network: apps/web/e2e/private-events.e2e.ts.
      E2E_SUITE: private-events
      # The setup empties atmo's local database before each run.
      E2E_ATMO_STATE_DIR: *atmo-state
      # atmo's own, above: a snowglobe app's settings win over the secret the setup would make.
      E2E_CRON_SECRET: *cron-secret
      E2E_ALPHA_PDS: ${pds.alpha.url}
      E2E_BETA_PDS: ${pds.beta.url}
      E2E_REGULAR_PDS: ${pds.regular.url}
      E2E_JETSTREAM: ${services.jetstream.url}
      E2E_ALICE_HANDLE: ${accounts.alice.handle}
      E2E_ALICE_PASSWORD: ${accounts.alice.password}
      E2E_BOB_HANDLE: ${accounts.bob.handle}
      E2E_BOB_PASSWORD: ${accounts.bob.password}
      E2E_MALLORY_HANDLE: ${accounts.mallory.handle}
      E2E_MALLORY_PASSWORD: ${accounts.mallory.password}
      E2E_DANA_HANDLE: ${accounts.dana.handle}
      E2E_DANA_PASSWORD: ${accounts.dana.password}
      E2E_CAROL_HANDLE: ${accounts.carol.handle}
      E2E_CAROL_PASSWORD: ${accounts.carol.password}
